<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Вежа Випробувань — Embercrypt</title>
  <style>
    :root{--bg:#05070d;--fg:#dfe6ff;--panel:#141a2e;--accent:#7c4dff;--gold:#ffcc66}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Courier New',monospace;color:var(--fg)}
    #wrap{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#05070d}
    #hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 14px;pointer-events:none;font-size:12px}
    .panel{background:rgba(10,14,26,.8);border:2px solid #2a3358;border-radius:6px;padding:8px 12px;display:inline-block}
    #hpbar{width:150px;height:11px;background:#2a3358;border-radius:3px;overflow:hidden;margin-top:5px}
    #hpfill{height:100%;background:linear-gradient(90deg,#ff4d6d,#ff8fa3);width:100%}
    #slots{display:flex;gap:6px;margin-top:7px}
    .slot{width:70px;height:34px;border:2px solid #3a4570;border-radius:6px;background:#0f1428;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;padding:2px}
    .slot.active{border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
    #msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:20px;letter-spacing:2px;text-shadow:0 0 10px #000;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
    #hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:10px;opacity:.65;text-align:center;pointer-events:none}
    #overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;z-index:5}
    .hidden{display:none!important}
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="dmgFlash"></div>
  <div id="hud" class="hidden">
    <div class="panel">
      <div id="floorTxt">Поверх 1</div>
      <div id="roomsTxt" style="opacity:.7;font-size:10px;">Кімнат зачищено: 0/0</div>
      <div id="hpbar"><div id="hpfill"></div></div>
      <div id="slots"><div class="slot" id="slotA"></div><div class="slot" id="slotB"></div></div>
    </div>
  </div>
  <div id="sndBtn" style="position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:34px;height:34px;border-radius:50%;background:rgba(10,14,26,.8);border:2px solid #2a3358;display:flex;align-items:center;justify-content:center">♪</div>
  <div id="msg"></div>
  <div id="hint" class="hidden">WASD — рух · ЛКМ/Пробіл — атака · Q — зброя · E — взаємодія · Shift — ривок · G — кинути</div>
  <div id="overlay">
    <div id="logo"><b>PIXEL</b> FORGE</div>
    <div id="loadbar" class="hidden"><div id="loadfill"></div></div>
  </div>
</div>

<script>
// === Ghost Ship Boss integrated into tower_game_clam-1.html ===
// Added by Copilot: Ghost Ship boss, 3 phases, ~10 attacks, demo controls.

/* Boss data/config */
const BOSS_PHASES = {
  1: { name: 'Руйнований борт', hp: 660, attackOrder: ['cannonVolley','tentacleGrab','orbBurst','ramCharge','orbTrail'] },
  2: { name: 'Хвилевий розрив', hp: 330, attackOrder: ['turretSweep','geyserBurst','ringWave','tentacleCombo'] },
  3: { name: 'Епоха корабля', hp: 0, attackOrder: ['massiveBlast','tideCorridor','heartOfTheShip','megaRing'] }
};

const BOSS_ATTACKS = {
  cannonVolley: { telegraph:0.8, duration:1.2, damage:22, pattern:'multi-shot' },
  tentacleGrab: { telegraph:0.9, duration:1.1, damage:32, pattern:'grab' },
  orbBurst: { telegraph:1.0, duration:2.0, damage:36, pattern:'ring' },
  ramCharge: { telegraph:0.7, duration:0.9, damage:28, pattern:'ram' },
  orbTrail: { telegraph:1.0, duration:1.6, damage:18, pattern:'trail' },
  turretSweep: { telegraph:1.1, duration:1.6, damage:30, pattern:'sweep' },
  geyserBurst: { telegraph:0.7, duration:1.3, damage:26, pattern:'geyser' },
  ringWave: { telegraph:1.2, duration:1.7, damage:42, pattern:'ring-wave' },
  tentacleCombo: { telegraph:1.0, duration:2.2, damage:48, pattern:'multi-grab' },
  massiveBlast: { telegraph:1.5, duration:2.5, damage:78, pattern:'mega' },
  tideCorridor: { telegraph:1.0, duration:2.0, damage:50, pattern:'lane' },
  heartOfTheShip: { telegraph:1.7, duration:3.0, damage:110, pattern:'core' },
  megaRing: { telegraph:1.4, duration:2.8, damage:92, pattern:'mega-ring' }
};

/* GhostShipBoss class */
class GhostShipBoss {
  constructor(x,y){
    this.x = x; this.y = y;
    this.maxHp = 1000; this.hp = this.maxHp;
    this.phase = 1; this.state = 'idle';
    this.currentAttack = null; this.currentTimer = 0; this.attackCooldown = 0.5; this.phaseTransitionTimer = 0;
    this.burst = []; this.hitFlash = 0; this.player = {x:0,y:0};
  }

  setPlayer(p){ this.player = p }

  getPhase(){ if(this.hp <= 330) return 3; if(this.hp <= 660) return 2; return 1 }

  update(dt, player){
    this.player = player;
    const newPhase = this.getPhase();
    if(newPhase !== this.phase){
      this.phase = newPhase;
      this.state = 'phaseTransition';
      this.phaseTransitionTimer = 1.4;
      this.burst.push({ x:this.x, y:this.y, life:1.4, color:'#dbeafe', size:36 });
    }

    if(this.state === 'phaseTransition'){
      this.phaseTransitionTimer -= dt;
      if(this.phaseTransitionTimer <= 0) this.state = 'idle';
      return;
    }

    if(this.state === 'idle'){
      this.attackCooldown -= dt;
      if(this.attackCooldown <= 0) this.startRandomAttack();
    }

    if(this.state === 'attacking' && this.currentAttack){
      this.currentTimer -= dt;
      this.updateAttackVisuals();
      if(this.currentTimer <= 0) this.finishAttack();
    }

    for(let i = this.burst.length-1; i >= 0; i--){
      this.burst[i].life -= dt;
      if(this.burst[i].life <= 0) this.burst.splice(i,1);
    }

    this.hitFlash = Math.max(0, this.hitFlash - dt * 2.5);
  }

  startRandomAttack(){
    const options = BOSS_PHASES[this.phase].attackOrder;
    const attackName = options[Math.floor(Math.random()*options.length)];
    this.startAttack(attackName);
  }

  startAttack(attackName){
    const attack = BOSS_ATTACKS[attackName];
    if(!attack) return;
    this.currentAttack = attackName;
    this.currentTimer = attack.telegraph + attack.duration;
    this.state = 'attacking';
    this.attackCooldown = 2.6;
    this.burst.push({ x:this.x, y:this.y, life:0.9, color:'#7dd3fc', size:40 });
  }

  updateAttackVisuals(){
    if(!this.currentAttack) return;
    const attack = BOSS_ATTACKS[this.currentAttack];
    if(!attack) return;
    // simple visual telegraphs near player
    if(this.currentTimer < attack.telegraph + attack.duration * 0.18){
      this.burst.push({ x: this.player.x + (Math.random()-0.5)*60, y: this.player.y + (Math.random()-0.5)*60, life:0.28, color:'#e0f2fe', size:8 });
    }
  }

  finishAttack(){ this.state = 'idle'; this.currentAttack = null; this.currentTimer = 0 }

  hit(damage){ this.hp = Math.max(0, this.hp - damage); this.hitFlash = 1; this.burst.push({ x:this.x, y:this.y, life:0.4, color:'#bfdbfe', size:20 }); if(this.hp <= 0) this.state = 'dead' }

  draw(ctx){
    if(this.state === 'dead') return;
    const phaseColor = this.phase === 3 ? '#7dd3fc' : this.phase === 2 ? '#60a5fa' : '#38bdf8';

    for(const p of this.burst){
      ctx.fillStyle = p.color; ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.beginPath(); ctx.arc(this.x + (Math.random()-0.5)*12, this.y + (Math.random()-0.5)*12, p.size * 0.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save(); ctx.translate(this.x, this.y);
    ctx.shadowColor = phaseColor; ctx.shadowBlur = 22;

    if(this.phase === 3){ ctx.strokeStyle = '#ecfeff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0,0,130 + Math.sin(Date.now()*0.01)*10, 0, Math.PI*2); ctx.stroke(); }

    // simplified ship silhouette
    ctx.fillStyle = phaseColor;
    ctx.beginPath(); ctx.moveTo(-90,30); ctx.lineTo(-30,-60); ctx.lineTo(30,-60); ctx.lineTo(90,30); ctx.lineTo(30,52); ctx.lineTo(-30,52); ctx.closePath(); ctx.fill();

    // sail
    ctx.fillStyle = '#dbeafe'; ctx.fillRect(-18, -72, 36, 60);

    // core glow
    if(this.currentAttack === 'heartOfTheShip' || this.phase === 3){ ctx.fillStyle = '#f8feff'; ctx.beginPath(); ctx.arc(0,-8,14,0,Math.PI*2); ctx.fill(); }

    if(this.state === 'phaseTransition'){ ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,102 + Math.sin(Date.now()*0.03)*15, 0, Math.PI*2); ctx.stroke(); }

    ctx.restore();

    if(this.hitFlash > 0){ ctx.fillStyle = `rgba(255,255,255,${this.hitFlash * 0.28})`; ctx.fillRect(this.x - 110, this.y - 110, 220, 220); }
  }

  drawHUD(ctx, width){
    const barW = 320; const barH = 12; const x = width/2 - barW/2; const y = 12;
    // bar background
    ctx.fillStyle = 'rgba(16,23,37,0.85)'; ctx.fillRect(x, y, barW, barH);
    ctx.strokeStyle = '#7dd3fc'; ctx.strokeRect(x,y,barW,barH);
    const fill = (this.hp / this.maxHp) * barW;
    ctx.fillStyle = '#60a5fa'; ctx.fillRect(x,y,fill,barH);
    ctx.fillStyle = '#e0f2fe'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillText(`КОРАБЕЛЬ-ПРИМАРA · Фаза ${this.phase}`, width/2, 10);
  }
}

// === End boss class ===

// Minimal integration with existing canvas/game loop in this file
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let DPR = window.devicePixelRatio || 1;
  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.floor(rect.width * DPR);
    canvas.height = Math.floor(rect.height * DPR);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  // place canvas to fill wrap
  canvas.style.width = '100%'; canvas.style.height = '100%';
  // attach to parent size
  function fullResize(){ const wrap = document.getElementById('wrap'); const rect = wrap.getBoundingClientRect(); canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px'; resizeCanvas(); }
  window.addEventListener('resize', fullResize);
  fullResize();

  // simple demo player
  const player = { x: 220, y: 520, vx:0, vy:0, speed:220 };
  const boss = new GhostShipBoss(canvas.clientWidth * 0.62, canvas.clientHeight * 0.46);
  boss.setPlayer(player);
  let bossActive = false;

  const keys = {};
  window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if(e.key.toLowerCase() === 'b'){ bossActive = !bossActive; } if(e.key === ' '){ if(bossActive && boss.state !== 'dead'){ boss.hit(40); } } });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  let last = performance.now();
  function loop(ts){
    const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts;

    // background
    drawBackground(ts * 0.001);

    // player movement
    if(keys.a || keys.arrowleft) player.x -= player.speed * dt;
    if(keys.d || keys.arrowright) player.x += player.speed * dt;
    if(keys.w || keys.arrowup) player.y -= player.speed * dt;
    if(keys.s || keys.arrowdown) player.y += player.speed * dt;
    player.x = Math.max(36, Math.min(canvas.clientWidth - 36, player.x));
    player.y = Math.max(80, Math.min(canvas.clientHeight - 64, player.y));

    // boss update/draw
    if(bossActive){ boss.setPlayer(player); boss.update(dt, player); boss.draw(ctx); document.getElementById('hpfill').style.width = ((boss.hp / boss.maxHp) * 100) + '%'; document.getElementById('roomsTxt').textContent = 'Бос: Активний'; document.getElementById('floorTxt').textContent = 'Локація: Руїни Кораблів'; }
    else { document.getElementById('roomsTxt').textContent = 'Бос: Неактивний'; }

    // draw player
    drawPlayer();

    if(bossActive && boss.state === 'dead'){
      ctx.fillStyle = 'rgba(220,252,255,0.95)'; ctx.textAlign = 'center'; ctx.font = 'bold 26px Courier New'; ctx.fillText('БОС ПОБІДЖЕНО', canvas.clientWidth/2, canvas.clientHeight*0.2);
      document.getElementById('msg').textContent = 'Корабель-примара знищено — локація очищена';
    }

    requestAnimationFrame(loop);
  }

  function drawBackground(t){
    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
    const g = ctx.createLinearGradient(0,0,0,canvas.clientHeight);
    g.addColorStop(0,'#071a2a'); g.addColorStop(.5,'#0b2b40'); g.addColorStop(1,'#061721');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);

    for(let i=0;i<36;i++){
      const x = (i*73 + Math.sin(t*0.45 + i) * 22) % (canvas.clientWidth + 120) - 60;
      const y = (i*38 + Math.cos(t*0.55 + i) * 14) % (canvas.clientHeight + 40) - 20;
      ctx.fillStyle = 'rgba(125,211,252,0.14)'; ctx.fillRect(x,y,3,3);
    }

    ctx.fillStyle = 'rgba(7,27,40,0.28)'; ctx.fillRect(0, canvas.clientHeight * 0.78, canvas.clientWidth, canvas.clientHeight * 0.22);
    for(let i=0;i<18;i++){ ctx.strokeStyle = 'rgba(147,197,253,0.06)'; ctx.beginPath(); ctx.moveTo(i*70, canvas.clientHeight*0.8); ctx.lineTo(i*70+30, canvas.clientHeight); ctx.stroke(); }
  }

  function drawPlayer(){
    // simple square player
    ctx.fillStyle = '#dbeafe'; ctx.fillRect(player.x - 14, player.y - 14, 28, 28);
    ctx.fillStyle = '#60a5fa'; ctx.fillRect(player.x - 6, player.y - 8, 12, 12);
  }

  // initialize
  resizeCanvas(); requestAnimationFrame(loop);
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embercrypt — Ghost Ship Boss</title>
  <style>
    :root {
      --bg-1: #02121b;
      --bg-2: #072230;
      --panel: rgba(10, 18, 26, 0.72);
      --blue: #7dd3fc;
      --cyan: #dbeafe;
      --glow: rgba(125, 211, 252, 0.8);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #0a1d2d, var(--bg-2) 38%, var(--bg-1) 70%);
      color: var(--cyan);
      font-family: "Courier New", monospace;
      overflow: hidden;
    }
    body { display: grid; place-items: center; }
    #game {
      width: min(100vw, 1200px);
      height: min(100vh, 700px);
      border: 3px solid rgba(125, 211, 252, 0.5);
      box-shadow: 0 0 30px rgba(125, 211, 252, 0.25);
      background: linear-gradient(#081b2a, #071722 60%, #050d18);
      position: relative;
      image-rendering: pixelated;
    }
    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .panel {
      background: rgba(10, 18, 26, 0.8);
      border: 2px solid rgba(125, 211, 252, 0.5);
      padding: 8px 12px;
      min-width: 220px;
      box-shadow: 0 0 12px rgba(125, 211, 252, 0.2);
    }
    .label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .hpbar {
      width: 100%;
      height: 12px;
      background: rgba(17, 28, 40, 0.9);
      border: 1px solid rgba(125, 211, 252, 0.6);
      margin-top: 8px;
      overflow: hidden;
    }
    .hpfill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #67e8f9, #60a5fa, #a5b4fc);
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.7);
    }
    .legend {
      font-size: 11px;
      letter-spacing: 1.5px;
      margin-top: 8px;
      opacity: 0.8;
    }
    .keys {
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="panel">
        <div class="label">Водяна локація</div>
        <div class="label" style="margin-top: 4px;">Перший бос</div>
        <div class="hpbar"><div class="hpfill" id="bossHP"></div></div>
        <div class="legend" id="phaseLabel">Фаза 1 · Руйнований борт</div>
      </div>
      <div class="panel keys">B — босс · A/D — ухил · Space — удар</div>
    </div>
  </div>

  <script type="module">
    import GhostShipBoss from './ghost_ship_boss.js';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hpFill = document.getElementById('bossHP');
    const phaseLabel = document.getElementById('phaseLabel');

    let w = 0;
    let h = 0;
    const resize = () => {
      const game = document.getElementById('game');
      w = game.clientWidth;
      h = game.clientHeight;
      canvas.width = Math.floor(w * window.devicePixelRatio);
      canvas.height = Math.floor(h * window.devicePixelRatio);
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    const boss = new GhostShipBoss(w * 0.5, h * 0.48);
    let activeBoss = false;
    let attackKeyPressed = false;

    const player = {
      x: w * 0.2,
      y: h * 0.72,
      vx: 0,
      vy: 0,
      speed: 220,
      attackTimer: 0
    };

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'b') activeBoss = !activeBoss;
      if (e.key === ' ') {
        attackKeyPressed = true;
        if (activeBoss && boss.state !== 'dead') {
          boss.hit(25 + Math.random() * 10);
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === ' ') attackKeyPressed = false;
    });

    const drawBackground = (t) => {
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#071a2a');
      g.addColorStop(0.5, '#0b2b40');
      g.addColorStop(1, '#061721');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 40; i++) {
        const x = (i * 83 + Math.sin(t * 0.5 + i) * 25) % (w + 120);
        const y = (i * 41 + Math.cos(t * 0.6 + i) * 12) % (h + 40);
        ctx.fillStyle = 'rgba(125, 211, 252, 0.22)';
        ctx.fillRect(x, y, 4, 4);
      }

      ctx.fillStyle = 'rgba(77, 144, 189, 0.18)';
      ctx.fillRect(0, h * 0.78, w, h * 0.22);

      for (let i = 0; i < 20; i++) {
        ctx.strokeStyle = 'rgba(147, 197, 253, 0.08)';
        ctx.beginPath();
        ctx.moveTo(i * 70, h * 0.8);
        ctx.lineTo(i * 70 + 30, h);
        ctx.stroke();
      }
    };

    const drawPlayer = () => {
      ctx.fillStyle = '#dbeafe';
      ctx.fillRect(player.x - 14, player.y - 14, 28, 28);
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(player.x - 6, player.y - 8, 12, 12);
    };

    let lastTime = 0;
    function loop(ts) {
      const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;

      drawBackground(ts * 0.001);

      if (keys.a || keys.arrowleft) player.x -= player.speed * dt;
      if (keys.d || keys.arrowright) player.x += player.speed * dt;
      if (keys.w || keys.arrowup) player.y -= player.speed * dt;
      if (keys.s || keys.arrowdown) player.y += player.speed * dt;

      player.x = Math.max(40, Math.min(w - 40, player.x));
      player.y = Math.max(80, Math.min(h - 80, player.y));

      if (activeBoss) {
        boss.setPlayer(player);
        boss.update(dt, player);
        boss.draw(ctx);
        hpFill.style.width = `${(boss.hp / boss.maxHp) * 100}%`;
        phaseLabel.textContent = `Фаза ${boss.phase} · ${BOSS_PHASES[boss.phase].name}`;
      }

      drawPlayer();

      if (activeBoss && boss.state === 'dead') {
        ctx.fillStyle = 'rgba(220, 252, 255, 0.95)';
        ctx.textAlign = 'center';
        ctx.font = 'bold 30px Courier New';
        ctx.fillText('БОС ПОБІДЖЕНО', w / 2, h * 0.2);
        ctx.font = '18px Courier New';
        ctx.fillText('Корабель-примара знищений. Водяна локація відкрита.', w / 2, h * 0.25);
      }

      requestAnimationFrame(loop);
    }

    boss.setPlayer(player);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
